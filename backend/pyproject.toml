[project]
name = "agente-evaluador-backend"
version = "1.0.0"
description = "Backend del Agente Evaluador Autónomo de Propuestas de Servicios — Hackatón Venezuela INNOVA 2026"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "greenlet>=3.1.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "cryptography>=44.0.0",
    "PyJWT>=2.10.0",
    "httpx>=0.28.0",
    "pymupdf>=1.25.0",
    "pypdf>=5.1.0",
    "openpyxl>=3.1.5",
    "Pillow>=11.0.0",
    "pytesseract>=0.3.13",
    "reportlab>=4.2.5",
    "ddgs>=7.0.0",
    "google-genai>=1.0.0",
    "openai>=1.58.0",
    "sse-starlette>=2.2.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]
